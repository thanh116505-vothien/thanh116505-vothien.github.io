<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <title>Vô Thiên Brand Emblem</title>
  <defs>
    <linearGradient id="emb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1DE9B"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6B32"/>
    </linearGradient>
  </defs>

  <!-- Background Plate -->
  <circle cx="128" cy="128" r="124" fill="#0B0D10" stroke="#8C6B32" stroke-width="1.5"/>
  <circle cx="128" cy="128" r="118" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="4, 3"/>
  <circle cx="128" cy="128" r="104" stroke="#8C6B32" stroke-width="1.2"/>
  <circle cx="128" cy="128" r="88" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="2, 4"/>
  <circle cx="128" cy="128" r="68" stroke="#8C6B32" stroke-width="1"/>
  <circle cx="128" cy="128" r="38" stroke="#D4AF37" stroke-width="1"/>

  <!-- Tangent Circles with Dots Frieze (Ring r=96) -->
  <g stroke="#D4AF37" stroke-width="0.8" fill="none" opacity="0.8">
    <circle cx="128" cy="32" r="3.5"/><circle cx="128" cy="32" r="1" fill="#D4AF37"/>
    <circle cx="196" cy="60" r="3.5"/><circle cx="196" cy="60" r="1" fill="#D4AF37"/>
    <circle cx="224" cy="128" r="3.5"/><circle cx="224" cy="128" r="1" fill="#D4AF37"/>
    <circle cx="196" cy="196" r="3.5"/><circle cx="196" cy="196" r="1" fill="#D4AF37"/>
    <circle cx="128" cy="224" r="3.5"/><circle cx="128" cy="224" r="1" fill="#D4AF37"/>
    <circle cx="60" cy="196" r="3.5"/><circle cx="60" cy="196" r="1" fill="#D4AF37"/>
    <circle cx="32" cy="128" r="3.5"/><circle cx="32" cy="128" r="1" fill="#D4AF37"/>
    <circle cx="60" cy="60" r="3.5"/><circle cx="60" cy="60" r="1" fill="#D4AF37"/>
  </g>

  <!-- Flying Lac Birds Silhouette Frieze (r=78) -->
  <g stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.6">
    <path d="M 128,50 C 138,45 150,47 160,55 M 145,46 L 150,38"/>
    <path d="M 206,128 C 201,138 203,150 211,160 M 202,145 L 210,150"/>
    <path d="M 128,206 C 118,211 106,209 96,201 M 111,210 L 106,218"/>
    <path d="M 50,128 C 55,118 53,106 45,96 M 54,111 L 46,106"/>
  </g>

  <!-- 14-Ray Dong Son Sun Star at Center -->
  <g transform="translate(128, 128)" fill="url(#emb-gold)">
    <polygon points="0,-38 5,-15 0,-5 -5,-15"/>
    <polygon points="0,38 5,15 0,5 -5,15"/>
    <polygon points="-38,0 -15,5 -5,0 -15,-5"/>
    <polygon points="38,0 15,5 5,0 15,-5"/>
    <polygon points="-26.8,-26.8 -8,-12 -4,-4 -12,-8"/>
    <polygon points="26.8,26.8 8,12 4,4 12,8"/>
    <polygon points="-26.8,26.8 -12,8 -4,4 -8,12"/>
    <polygon points="26.8,-26.8 12,-8 4,-4 8,-12"/>
    <polygon points="-35.1,-14.5 -13,-3 -6,-1 -11,-8"/>
    <polygon points="35.1,14.5 13,3 6,1 11,8"/>
    <polygon points="-14.5,-35.1 -3,-13 -1,-6 -8,-11"/>
    <polygon points="14.5,35.1 3,13 1,6 8,11"/>
    <polygon points="-14.5,35.1 -3,13 -1,6 -8,11"/>
    <polygon points="14.5,-35.1 3,-13 1,-6 8,-11"/>
    <!-- Solar Core -->
    <circle cx="0" cy="0" r="7" fill="#F1DE9B"/>
    <circle cx="0" cy="0" r="3" fill="#0B0D10"/>
    <circle cx="0" cy="0" r="1.5" fill="#36D7E8"/>
  </g>

  <!-- Cardinal Circuit Nodes -->
  <circle cx="128" cy="4" r="2.5" fill="#36D7E8"/>
  <circle cx="128" cy="252" r="2.5" fill="#00C896"/>
  <circle cx="4" cy="128" r="2.5" fill="#D4AF37"/>
  <circle cx="252" cy="128" r="2.5" fill="#36D7E8"/>
</svg>
