<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" fill="none">
  <title>AI-Assisted Game Localization Pipeline - Từ Đồng Đến Mã</title>
  <desc>Seven-stage systematic localization workflow from raw extraction to validated JSON export</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pipe-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1217"/>
      <stop offset="100%" stop-color="#07090C"/>
    </linearGradient>

    <!-- Pipeline Flow Circuit Gradient -->
    <linearGradient id="pipe-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="40%" stop-color="#00C896"/>
      <stop offset="100%" stop-color="#36D7E8"/>
    </linearGradient>
  </defs>

  <!-- Background Plate -->
  <rect width="880" height="260" rx="8" fill="url(#pipe-bg)"/>
  <rect x="8" y="8" width="864" height="244" rx="6" stroke="#1B2129" stroke-width="1.2"/>
  <rect x="12" y="12" width="856" height="236" rx="4" stroke="#8C6B32" stroke-width="0.8" stroke-dasharray="8, 6" opacity="0.3"/>

  <!-- Corner Brackets -->
  <path d="M10,26 L10,10 L26,10" stroke="#D4AF37" stroke-width="1.6" fill="none"/>
  <path d="M870,26 L870,10 L854,10" stroke="#36D7E8" stroke-width="1.6" fill="none"/>
  <path d="M10,234 L10,250 L26,250" stroke="#8C6B32" stroke-width="1.6" fill="none"/>
  <path d="M870,234 L870,250 L854,250" stroke="#00C896" stroke-width="1.6" fill="none"/>

  <!-- Diagram Title Header -->
  <text x="440" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#D4AF37">
    AI-ASSISTED LOCALIZATION PIPELINE ARCHITECTURE
  </text>
  <text x="440" y="55" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#B9B2A3" letter-spacing="1">
    FROM RAW GAME ASSETS TO RIGOROUS VALIDATED EXPORT
  </text>

  <!-- Connecting Bus Circuit Line with Jogs -->
  <path d="M 64,120 L 180,120 L 296,120 L 412,120 L 528,120 L 644,120 L 760,120 L 816,120" 
        stroke="url(#pipe-flow)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Parallel Data Traces -->
  <path d="M 64,126 L 160,126 L 170,136 L 400,136 L 410,126 L 630,126 L 640,136 L 800,136" 
        stroke="#8C6B32" stroke-width="1" stroke-dasharray="4, 3" opacity="0.5"/>

  <!-- ==================== NODE 01: EXTRACTION (GOLD) ==================== -->
  <g transform="translate(68, 120)">
    <!-- Medallion -->
    <circle cx="0" cy="0" r="24" fill="#12161B" stroke="#D4AF37" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="19" stroke="#8C6B32" stroke-width="0.8" stroke-dasharray="2, 2"/>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#F1DE9B">01</text>
    <!-- Label -->
    <text x="0" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#EAE4D8">Extraction</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#B9B2A3">Assets / Raw</text>
    <text x="0" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#D4AF37">Unity/RenPy</text>
  </g>

  <!-- ==================== NODE 02: CONTEXT (GOLD) ==================== -->
  <g transform="translate(192, 120)">
    <circle cx="0" cy="0" r="24" fill="#12161B" stroke="#D4AF37" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="19" stroke="#8C6B32" stroke-width="0.8" stroke-dasharray="2, 2"/>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#F1DE9B">02</text>
    <text x="0" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#EAE4D8">Context</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#B9B2A3">Lore &amp; Speaker</text>
    <text x="0" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#D4AF37">Graph Meta</text>
  </g>

  <!-- ==================== NODE 03: LLM TRANSLATION (JADE) ==================== -->
  <g transform="translate(316, 120)">
    <circle cx="0" cy="0" r="25" fill="#12161B" stroke="#00C896" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" stroke="#00C896" stroke-width="0.8" stroke-dasharray="2, 2" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00C896">03</text>
    <text x="0" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#EAE4D8">LLM Engine</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#B9B2A3">Few-Shot Prompt</text>
    <text x="0" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#00C896">Localized VN</text>
  </g>

  <!-- ==================== NODE 04: TERMINOLOGY (JADE) ==================== -->
  <g transform="translate(440, 120)">
    <circle cx="0" cy="0" r="24" fill="#12161B" stroke="#00C896" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="19" stroke="#00C896" stroke-width="0.8" stroke-dasharray="2, 2" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#00C896">04</text>
    <text x="0" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#EAE4D8">Terminology</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#B9B2A3">Glossary Sync</text>
    <text x="0" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#00C896">Consistency</text>
  </g>

  <!-- ==================== NODE 05: PLACEHOLDER VALIDATION (CYAN) ==================== -->
  <g transform="translate(564, 120)">
    <circle cx="0" cy="0" r="24" fill="#12161B" stroke="#36D7E8" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="19" stroke="#36D7E8" stroke-width="0.8" stroke-dasharray="2, 2" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#36D7E8">05</text>
    <text x="0" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#EAE4D8">Validation</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#B9B2A3">Tags &amp; Variables</text>
    <text x="0" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#36D7E8">{0} &lt;color&gt; \n</text>
  </g>

  <!-- ==================== NODE 06: QA REVIEW (CYAN) ==================== -->
  <g transform="translate(688, 120)">
    <circle cx="0" cy="0" r="24" fill="#12161B" stroke="#36D7E8" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="19" stroke="#36D7E8" stroke-width="0.8" stroke-dasharray="2, 2" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#36D7E8">06</text>
    <text x="0" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#EAE4D8">QA Review</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#B9B2A3">In-Game Test</text>
    <text x="0" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#36D7E8">Glyph &amp; Overflow</text>
  </g>

  <!-- ==================== NODE 07: JSON EXPORT (CYAN) ==================== -->
  <g transform="translate(812, 120)">
    <circle cx="0" cy="0" r="25" fill="#12161B" stroke="#36D7E8" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2, 2"/>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#F1DE9B">07</text>
    <text x="0" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#EAE4D8">JSON Export</text>
    <text x="0" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#B9B2A3">Clean Repack</text>
    <text x="0" y="70" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8" fill="#36D7E8">100% Intact</text>
  </g>

  <!-- Bottom Sub-Label -->
  <text x="440" y="234" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8C6B32">
    TỪ ĐỒNG ĐẾN MÃ · SYSTEMATIC DATA TRANSFORMATION &amp; REVERSE INTEGRATION
  </text>
</svg>
