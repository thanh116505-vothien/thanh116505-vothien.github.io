<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 170" width="280" height="170" fill="none">
  <title>Milestone: uTest Security &amp; QA</title>
  <defs>
    <linearGradient id="c-gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1DE9B"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6B32"/>
    </linearGradient>
  </defs>

  <!-- Background Plate -->
  <rect width="280" height="170" rx="6" fill="#12161B"/>

  <!-- Faded Dong Son Sun Star in Background (8% opacity) -->
  <g transform="translate(140, 75)" opacity="0.08" stroke="#D4AF37" stroke-width="1.2" fill="none">
    <circle cx="0" cy="0" r="55"/>
    <circle cx="0" cy="0" r="42" stroke-dasharray="3, 3"/>
    <circle cx="0" cy="0" r="28"/>
    <polygon points="0,-28 4,-12 0,-5 -4,-12" fill="#D4AF37"/>
    <polygon points="0,28 4,12 0,5 -4,12" fill="#D4AF37"/>
    <polygon points="-28,0 -12,4 -5,0 -12,-4" fill="#D4AF37"/>
    <polygon points="28,0 12,4 5,0 12,-4" fill="#D4AF37"/>
  </g>

  <!-- Outer Gold Frame -->
  <rect x="8" y="8" width="264" height="154" rx="4" stroke="#D4AF37" stroke-width="1.4"/>
  <!-- Inner Bronze Frame -->
  <rect x="13" y="13" width="254" height="144" rx="2" stroke="#8C6B32" stroke-width="0.8" opacity="0.7"/>

  <!-- Corner Brackets & Circuit Accents -->
  <circle cx="8" cy="8" r="1.5" fill="#36D7E8"/>
  <circle cx="272" cy="8" r="1.5" fill="#36D7E8"/>
  <circle cx="8" cy="162" r="1.5" fill="#00C896"/>
  <circle cx="272" cy="162" r="1.5" fill="#00C896"/>

  <!-- Display Wordmark: uTest -->
  <text x="140" y="70" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="url(#c-gold3)" letter-spacing="2">
    uTest
  </text>

  <!-- Title / Label -->
  <text x="140" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#EAE4D8" letter-spacing="0.5">
    Security &amp; QA Testing
  </text>

  <!-- Subtitle / Description -->
  <text x="140" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#B9B2A3">
    Functional verification, bug reproduction,
  </text>
  <text x="140" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#B9B2A3">
    vulnerability assessment &amp; regression.
  </text>
</svg>
